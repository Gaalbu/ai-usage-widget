name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: mvn --batch-mode -Pnative package
      - run: target/ai-usage-widget --pretty
        env:
          HOME: ${{ runner.temp }}/empty-home
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
      - run: ./scripts/package.sh target/ai-usage-widget
      - run: cp target/ai-usage-widget-0.2.0-all.jar dist/
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ai-usage-widget-linux-x86_64.tar.gz
            dist/ai-usage-widget@gaalbu.github.io.shell-extension.zip
            dist/ai-usage-widget-0.2.0-all.jar
            dist/SHA256SUMS
